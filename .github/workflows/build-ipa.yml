name: Build TrollStore IPA

on:
  push:
    branches:
      - build-ipa
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod or dev)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prepare iOS dependencies
        run: |
          CHANNEL_NAME="${{ github.event.inputs.channel || 'prod' }}"
          echo "Building on channel: $CHANNEL_NAME"
          make CHANNEL=$CHANNEL_NAME ios-prepare

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: |
          # 1. Create clean entitlements for main app (removes macOS-specific keys and aps-environment)
          cat << 'EOF' > Runner.entitlements.tmp
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>com.apple.developer.networking.networkextension</key>
	<array>
		<string>app-proxy-provider</string>
		<string>dns-proxy</string>
		<string>packet-tunnel-provider</string>
	</array>
	<key>com.apple.developer.networking.vpn.api</key>
	<array>
		<string>allow-vpn</string>
	</array>
	<key>com.apple.security.application-groups</key>
	<array>
		<string>group.apple.hiddify.com</string>
	</array>
</dict>
</plist>
EOF

          # 2. Create clean entitlements for packet tunnel extension (removes macOS-specific keys)
          cat << 'EOF' > HiddifyPacketTunnel.entitlements.tmp
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>com.apple.developer.networking.networkextension</key>
	<array>
		<string>app-proxy-provider</string>
		<string>dns-proxy</string>
		<string>packet-tunnel-provider</string>
		<string>content-filter-provider</string>
	</array>
	<key>com.apple.security.application-groups</key>
	<array>
		<string>group.apple.hiddify.com</string>
	</array>
	<key>com.apple.developer.networking.vpn.api</key>
	<array>
		<string>allow-vpn</string>
	</array>
</dict>
</plist>
EOF

          # 3. Re-create the Payload directory and copy Runner.app preserving symlinks
          rm -rf Payload
          mkdir -p Payload
          cp -PR build/ios/iphoneos/Runner.app Payload/

          # 4. Sign all dynamic frameworks (excluding symlinks)
          find Payload/Runner.app -name "*.framework" -type d | while read -r framework; do
              if [ ! -L "$framework" ]; then
                  echo "Signing framework: $framework"
                  codesign --force --sign - --generate-entitlement-der "$framework"
              fi
          done

          # 5. Sign all shared libraries (excluding symlinks)
          find Payload/Runner.app -name "*.dylib" -type f | while read -r dylib; do
              if [ ! -L "$dylib" ]; then
                  echo "Signing dylib: $dylib"
                  codesign --force --sign - --generate-entitlement-der "$dylib"
              fi
          done

          # 6. Sign the App Extension inside PlugIns/ with its own entitlements
          if [ -d "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex" ]; then
              echo "Signing HiddifyPacketTunnel.appex"
              codesign --force --sign - --entitlements HiddifyPacketTunnel.entitlements.tmp --generate-entitlement-der Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex
          else
              echo "No HiddifyPacketTunnel.appex found!"
          fi

          # 7. Sign the main Runner.app executable with its own entitlements
          echo "Signing Runner.app"
          codesign --force --sign - --entitlements Runner.entitlements.tmp --generate-entitlement-der Payload/Runner.app

          # 8. Compress into IPA preserving symlinks
          zip -ry Hiddify-TrollStore.ipa Payload
          ls -lh Hiddify-TrollStore.ipa

          # 9. Clean up temp files
          rm -f Runner.entitlements.tmp HiddifyPacketTunnel.entitlements.tmp

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-TrollStore-IPA
          path: Hiddify-TrollStore.ipa
          retention-days: 7
