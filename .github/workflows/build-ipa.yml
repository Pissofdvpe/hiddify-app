name: Build TrollStore IPA

on:
  push:
    branches:
      - build-ipa
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod or dev)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prepare iOS dependencies
        run: |
          CHANNEL_NAME="${{ github.event.inputs.channel || 'prod' }}"
          echo "Building on channel: $CHANNEL_NAME"
          make CHANNEL=$CHANNEL_NAME ios-prepare

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: |
          # 1. Substitute the BASE_BUNDLE_IDENTIFIER in the entitlements files
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/Runner/Runner.entitlements > Runner.entitlements.tmp
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements > HiddifyPacketTunnel.entitlements.tmp

          # 2. Re-create the Payload directory and copy Runner.app preserving symlinks
          rm -rf Payload
          mkdir -p Payload
          cp -PR build/ios/iphoneos/Runner.app Payload/

          # 3. Sign all dynamic frameworks (excluding symlinks)
          find Payload/Runner.app -name "*.framework" -type d | while read -r framework; do
              if [ ! -L "$framework" ]; then
                  echo "Signing framework: $framework"
                  codesign --force --sign - --generate-entitlement-der "$framework"
              fi
          done

          # 4. Sign all shared libraries (excluding symlinks)
          find Payload/Runner.app -name "*.dylib" -type f | while read -r dylib; do
              if [ ! -L "$dylib" ]; then
                  echo "Signing dylib: $dylib"
                  codesign --force --sign - --generate-entitlement-der "$dylib"
              fi
          done

          # 5. Sign the App Extension inside PlugIns/ with its own entitlements
          if [ -d "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex" ]; then
              echo "Signing HiddifyPacketTunnel.appex"
              codesign --force --sign - --entitlements HiddifyPacketTunnel.entitlements.tmp --generate-entitlement-der Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex
          else
              echo "No HiddifyPacketTunnel.appex found!"
          fi

          # 6. Sign the main Runner.app executable with its own entitlements
          echo "Signing Runner.app"
          codesign --force --sign - --entitlements Runner.entitlements.tmp --generate-entitlement-der Payload/Runner.app

          # 7. Compress into IPA preserving symlinks
          zip -ry Hiddify-TrollStore.ipa Payload
          ls -lh Hiddify-TrollStore.ipa

          # 8. Clean up temp files
          rm -f Runner.entitlements.tmp HiddifyPacketTunnel.entitlements.tmp

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-TrollStore-IPA
          path: Hiddify-TrollStore.ipa
          retention-days: 7
