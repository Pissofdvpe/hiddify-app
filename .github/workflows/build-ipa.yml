name: Build TrollStore IPA

on:
  push:
    branches:
      - build-ipa
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod or dev)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prepare iOS dependencies
        run: |
          CHANNEL_NAME="${{ github.event.inputs.channel || 'prod' }}"
          echo "Building on channel: $CHANNEL_NAME"
          make CHANNEL=$CHANNEL_NAME ios-prepare

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: |
          # 1. Create a self-signed codesigning certificate with a dummy Team ID (OU=TrollStoreID)
          # We MUST add extendedKeyUsage = codeSigning so that codesign recognizes it as a valid codesigning identity!
          openssl genrsa -out key.pem 2048
          openssl req -new -key key.pem -out req.csr -subj "/CN=TrollStore/OU=TrollStoreID"
          # Write cert.ext using echo statements to avoid YAML syntax errors
          echo 'keyUsage = digitalSignature' > cert.ext
          echo 'extendedKeyUsage = codeSigning' >> cert.ext
          openssl x509 -req -days 3650 -in req.csr -signkey key.pem -out cert.pem -extfile cert.ext
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -password pass:123456

          # 2. Setup a temporary keychain on the macOS runner using absolute path
          KEYCHAIN_PATH="$(pwd)/signing_temp.keychain"
          security create-keychain -p "123456" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "123456" "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "123456" -T /usr/bin/codesign
          
          # Append our keychain to the user search list so codesign can locate it
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "123456" "$KEYCHAIN_PATH"

          # 3. Re-create the Payload directory and copy Runner.app preserving symlinks
          rm -rf Payload
          mkdir -p Payload
          cp -PR build/ios/iphoneos/Runner.app Payload/
          rm -rf Payload/Runner.app/AppIcon.icon

          # 3.5 Generate dummy provisioning profiles to prevent TrollStore from crashing on import
          generate_profile() {
            local bundle_id="$1"
            local output_file="$2"
            
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
            	<key>AppIDName</key>
            	<string>'"${bundle_id}"'</string>
            	<key>ApplicationIdentifierPrefix</key>
            	<array>
            		<string>TrollStoreID</string>
            	</array>
            	<key>CreationDate</key>
            	<date>2026-06-11T12:00:00Z</date>
            	<key>ExpirationDate</key>
            	<date>2036-06-11T12:00:00Z</date>
            	<key>Entitlements</key>
            	<dict>
            		<key>keychain-access-groups</key>
            		<array>
            			<string>TrollStoreID.'"${bundle_id}"'</string>
            		</array>
            		<key>get-task-allow</key>
            		<true/>
            		<key>com.apple.developer.team-identifier</key>
            		<string>TrollStoreID</string>
            		<key>com.apple.developer.networking.networkextension</key>
            		<array>
            			<string>app-proxy-provider</string>
            			<string>dns-proxy</string>
            			<string>packet-tunnel-provider</string>
            		</array>
            		<key>com.apple.developer.networking.vpn.api</key>
            		<array>
            			<string>allow-vpn</string>
            		</array>
            		<key>com.apple.security.application-groups</key>
            		<array>
            			<string>group.apple.hiddify.com</string>
            		</array>
            	</dict>
            	<key>Name</key>
            	<string>TrollStore Profile '"${bundle_id}"'</string>
            	<key>TeamIdentifier</key>
            	<array>
            		<string>TrollStoreID</string>
            	</array>
            	<key>TeamName</key>
            	<string>TrollStore</string>
            	<key>TimeToLive</key>
            	<integer>3650</integer>
            	<key>UUID</key>
            	<string>87191ca2-0fc9-11d4-849a-000502b52122</string>
            	<key>Version</key>
            	<integer>1</integer>
            </dict>
            </plist>' | sed 's/^[[:space:]]*//' > profile.plist

            openssl smime -sign -signer cert.pem -inkey key.pem -certfile cert.pem -nodetach -outform DER -in profile.plist -out "${output_file}"
            rm -f profile.plist
          }

          echo "Generating dummy embedded.mobileprovision for main app..."
          generate_profile "apple.hiddify.com" "Payload/Runner.app/embedded.mobileprovision"
          
          if [ -d "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex" ]; then
              echo "Generating dummy embedded.mobileprovision for VPN extension..."
              generate_profile "apple.hiddify.com.HiddifyPacketTunnel" "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex/embedded.mobileprovision"
          fi

          # 4. Sign all dynamic frameworks (excluding symlinks) using our self-signed certificate
          find Payload/Runner.app -name "*.framework" -type d | while read -r framework; do
              if [ ! -L "$framework" ]; then
                  echo "Signing framework: $framework"
                  codesign --force --sign "TrollStore" --generate-entitlement-der "$framework"
              fi
          done

          # 5. Sign all shared libraries (excluding symlinks)
          find Payload/Runner.app -name "*.dylib" -type f | while read -r dylib; do
              if [ ! -L "$dylib" ]; then
                  echo "Signing dylib: $dylib"
                  codesign --force --sign "TrollStore" --generate-entitlement-der "$dylib"
              fi
          done

          # 6. Sign the App Extension inside PlugIns/ with its entitlements (resolving $(BASE_BUNDLE_IDENTIFIER) placeholder)
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements > HiddifyPacketTunnel.entitlements.tmp
          if [ -d "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex" ]; then
              echo "Signing HiddifyPacketTunnel.appex"
              codesign --force --sign "TrollStore" --entitlements HiddifyPacketTunnel.entitlements.tmp --generate-entitlement-der Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex
          else
              echo "No HiddifyPacketTunnel.appex found!"
          fi

          # 7. Sign the main Runner.app executable with its entitlements
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/Runner/Runner.entitlements > Runner.entitlements.tmp
          echo "Signing Runner.app"
          codesign --force --sign "TrollStore" --entitlements Runner.entitlements.tmp --generate-entitlement-der Payload/Runner.app

          # 8. Recursively clean macOS metadata junk from Payload
          xattr -cr Payload
          find Payload -name ".DS_Store" -delete

          # 9. Compress into IPA preserving symlinks and excluding any macOS metadata junk
          zip -ry Hiddify-TrollStore.ipa Payload -x "*.DS_Store" -x "__MACOSX" -x "*/.DS_Store" -x "*/__MACOSX"
          ls -lh Hiddify-TrollStore.ipa

          # 10. Clean up keychain and cert files
          security delete-keychain "$KEYCHAIN_PATH"
          rm -f key.pem req.csr cert.pem cert.p12 cert.ext Runner.entitlements.tmp HiddifyPacketTunnel.entitlements.tmp

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-TrollStore-IPA
          path: Hiddify-TrollStore.ipa
          retention-days: 7
