name: Build TrollStore IPA

on:
  push:
    branches:
      - build-ipa
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod or dev)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prepare iOS dependencies
        run: |
          CHANNEL_NAME="${{ github.event.inputs.channel || 'prod' }}"
          echo "Building on channel: $CHANNEL_NAME"
          make CHANNEL=$CHANNEL_NAME ios-prepare

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          # Copy Runner.app using -P to preserve symbolic links
          cp -PR build/ios/iphoneos/Runner.app Payload/

          # Perform ad-hoc codesigning on the app bundle and frameworks recursively.
          # We do NOT specify --entitlements to let codesign preserve the correct, Xcode-compiled entitlements and structures.
          codesign --force --deep --sign - Payload/Runner.app

          # Recursively clean macOS metadata junk from Payload
          xattr -cr Payload
          find Payload -name ".DS_Store" -delete

          # Compress into IPA preserving symlinks and excluding any macOS metadata junk
          zip -ry Hiddify-TrollStore.ipa Payload -x "*.DS_Store" -x "__MACOSX" -x "*/.DS_Store" -x "*/__MACOSX"
          ls -lh Hiddify-TrollStore.ipa

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-TrollStore-IPA
          path: Hiddify-TrollStore.ipa
          retention-days: 7
