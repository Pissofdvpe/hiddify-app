name: Build TrollStore IPA

on:
  push:
    branches:
      - build-ipa
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod or dev)'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build-ipa:
    name: Build TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Prepare iOS dependencies
        run: |
          CHANNEL_NAME="${{ github.event.inputs.channel || 'prod' }}"
          echo "Building on channel: $CHANNEL_NAME"
          make CHANNEL=$CHANNEL_NAME ios-prepare

      - name: Build iOS App (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package TrollStore IPA
        run: |
          # 1. Create a self-signed certificate with a dummy Team ID (OU=TrollStoreID)
          openssl genrsa -out key.pem 2048
          openssl req -new -key key.pem -out req.csr -subj "/CN=TrollStore/OU=TrollStoreID"
          openssl x509 -req -days 3650 -in req.csr -signkey key.pem -out cert.pem
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem -password pass:123456

          # 2. Setup a temporary keychain on the macOS runner
          security create-keychain -p "123456" signing_temp.keychain
          security default-keychain -s signing_temp.keychain
          security unlock-keychain -p "123456" signing_temp.keychain
          security import cert.p12 -k signing_temp.keychain -P "123456" -T /usr/bin/codesign
          # Append the temporary keychain to the keychain search list so codesign can search it
          security list-keychains -d user -s signing_temp.keychain $(security list-keychains -d user | xargs)
          # Mark the self-signed certificate as trusted for codesigning
          security add-trusted-cert -d -r trustRoot -k signing_temp.keychain cert.pem
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "123456" signing_temp.keychain

          # 3. Re-create the Payload directory and copy Runner.app preserving symlinks
          rm -rf Payload
          mkdir -p Payload
          cp -PR build/ios/iphoneos/Runner.app Payload/

          # 4. Sign all dynamic frameworks (excluding symlinks) using our self-signed certificate
          find Payload/Runner.app -name "*.framework" -type d | while read -r framework; do
              if [ ! -L "$framework" ]; then
                  echo "Signing framework: $framework"
                  codesign --force --sign "TrollStore" --generate-entitlement-der "$framework"
              fi
          done

          # 5. Sign all shared libraries (excluding symlinks)
          find Payload/Runner.app -name "*.dylib" -type f | while read -r dylib; do
              if [ ! -L "$dylib" ]; then
                  echo "Signing dylib: $dylib"
                  codesign --force --sign "TrollStore" --generate-entitlement-der "$dylib"
              fi
          done

          # 6. Sign the App Extension inside PlugIns/ with its entitlements (resolving $(BASE_BUNDLE_IDENTIFIER) placeholder)
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/HiddifyPacketTunnel/HiddifyPacketTunnel.entitlements > HiddifyPacketTunnel.entitlements.tmp
          if [ -d "Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex" ]; then
              echo "Signing HiddifyPacketTunnel.appex"
              codesign --force --sign "TrollStore" --entitlements HiddifyPacketTunnel.entitlements.tmp --generate-entitlement-der Payload/Runner.app/PlugIns/HiddifyPacketTunnel.appex
          else
              echo "No HiddifyPacketTunnel.appex found!"
          fi

          # 7. Sign the main Runner.app executable with its entitlements
          sed 's/\$(BASE_BUNDLE_IDENTIFIER)/apple.hiddify.com/g' ios/Runner/Runner.entitlements > Runner.entitlements.tmp
          echo "Signing Runner.app"
          codesign --force --sign "TrollStore" --entitlements Runner.entitlements.tmp --generate-entitlement-der Payload/Runner.app

          # 8. Recursively clean macOS metadata junk from Payload
          xattr -cr Payload
          find Payload -name ".DS_Store" -delete

          # 9. Compress into IPA preserving symlinks and excluding any macOS metadata junk
          zip -ry Hiddify-TrollStore.ipa Payload -x "*.DS_Store" -x "__MACOSX" -x "*/.DS_Store" -x "*/__MACOSX"
          ls -lh Hiddify-TrollStore.ipa

          # 10. Clean up keychain and cert files
          security delete-keychain signing_temp.keychain
          rm -f key.pem req.csr cert.pem cert.p12 Runner.entitlements.tmp HiddifyPacketTunnel.entitlements.tmp

      - name: Upload TrollStore IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiddify-TrollStore-IPA
          path: Hiddify-TrollStore.ipa
          retention-days: 7
